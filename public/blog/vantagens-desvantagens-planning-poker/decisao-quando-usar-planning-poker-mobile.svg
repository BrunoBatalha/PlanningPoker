<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo móvel para decidir quando usar Planning Poker</title>
  <desc id="desc">Quatro perguntas verificam perspectivas, contexto, participantes e segurança. Respostas negativas indicam uma alternativa; respostas positivas levam ao Planning Poker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#111b36"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e6f2"/><stop offset="1" stop-color="#219bd8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowNo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66708f"/></marker>
  </defs>
  <rect width="768" height="1120" rx="28" fill="url(#bg)"/>
  <text x="384" y="48" text-anchor="middle" fill="#f7f8ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Planning Poker é a ferramenta certa?</text>
  <text x="384" y="78" text-anchor="middle" fill="#aeb7d4" font-family="Arial, sans-serif" font-size="18">Siga o “sim”; use a saída quando for “não”.</text>

  <g font-family="Arial, sans-serif">
    <rect x="34" y="108" width="334" height="178" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="70" cy="145" r="20" fill="url(#violet)"/><text x="70" y="152" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">1</text>
    <text x="201" y="174" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="201">Mais de uma perspectiva</tspan><tspan x="201" dy="31">pode mudar a decisão?</tspan></text>
    <text x="201" y="253" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM ↓</text>
    <path d="M368 197H404" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/>
    <rect x="414" y="108" width="320" height="178" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="574" y="159" text-anchor="middle" fill="#dce2f4" font-size="20" font-weight="700"><tspan x="574">NÃO: estimativa</tspan><tspan x="574" dy="27">simples e revisável</tspan></text>
    <text x="574" y="229" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="574">Registre premissas.</tspan><tspan x="574" dy="23">Evite reunião sem ganho.</tspan></text>

    <path d="M201 286V326" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="34" y="336" width="334" height="178" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="70" cy="373" r="20" fill="url(#violet)"/><text x="70" y="380" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
    <text x="201" y="402" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="201">Há contexto suficiente</tspan><tspan x="201" dy="31">para comparar o item?</tspan></text>
    <text x="201" y="481" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM ↓</text>
    <path d="M368 425H404" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/>
    <rect x="414" y="336" width="320" height="178" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="574" y="387" text-anchor="middle" fill="#dce2f4" font-size="20" font-weight="700"><tspan x="574">NÃO: esclareça,</tspan><tspan x="574" dy="27">divida ou investigue</tspan></text>
    <text x="574" y="457" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="574">Não transforme lacuna</tspan><tspan x="574" dy="23">em um número.</tspan></text>

    <path d="M201 514V554" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="34" y="564" width="334" height="178" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="70" cy="601" r="20" fill="url(#violet)"/><text x="70" y="608" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">3</text>
    <text x="201" y="630" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="201">Quem entrega participa</tspan><tspan x="201" dy="31">e conhece a escala?</tspan></text>
    <text x="201" y="709" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM ↓</text>
    <path d="M368 653H404" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/>
    <rect x="414" y="564" width="320" height="178" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="574" y="615" text-anchor="middle" fill="#dce2f4" font-size="20" font-weight="700"><tspan x="574">NÃO: reúna quem faz</tspan><tspan x="574" dy="27">e calibre referências</tspan></text>
    <text x="574" y="685" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="574">Compartilhe histórias</tspan><tspan x="574" dy="23">comparáveis.</tspan></text>

    <path d="M201 742V782" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="34" y="792" width="334" height="178" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="70" cy="829" r="20" fill="url(#violet)"/><text x="70" y="836" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">4</text>
    <text x="201" y="858" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="201">Existe segurança para</tspan><tspan x="201" dy="31">escolher e discordar?</tspan></text>
    <text x="201" y="937" text-anchor="middle" fill="#bff8ff" font-size="17" font-weight="700">SIM ↓ USE PLANNING POKER</text>
    <path d="M368 881H404" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/>
    <rect x="414" y="792" width="320" height="178" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="574" y="843" text-anchor="middle" fill="#dce2f4" font-size="20" font-weight="700"><tspan x="574">NÃO: separe prazo,</tspan><tspan x="574" dy="27">cargo e tamanho</tspan></text>
    <text x="574" y="913" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="574">Proteja a conversa</tspan><tspan x="574" dy="23">antes de votar.</tspan></text>

    <rect x="34" y="1002" width="700" height="82" rx="22" fill="#10364c" stroke="#55e6f2" stroke-width="2"/>
    <text x="384" y="1035" text-anchor="middle" fill="#e9fcff" font-size="21" font-weight="700">Sucesso: a conversa produziu informação nova?</text>
    <text x="384" y="1066" text-anchor="middle" fill="#aedbe3" font-size="17">Se não, simplifique o próximo item.</text>
  </g>
</svg>
