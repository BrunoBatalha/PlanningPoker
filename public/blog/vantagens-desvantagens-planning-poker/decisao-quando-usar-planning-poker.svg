<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Decisão em quatro perguntas para usar Planning Poker</title>
  <desc id="desc">O fluxo verifica perspectivas, contexto, participantes e segurança para discordar. Cada resposta negativa indica uma alternativa; quatro respostas positivas levam ao Planning Poker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#111b36"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e6f2"/><stop offset="1" stop-color="#219bd8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowNo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66708f"/></marker>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <path d="M0 150H1400M0 408H1400M0 676H1400" stroke="#fff" stroke-opacity=".035"/>
  <text x="700" y="60" text-anchor="middle" fill="#f7f8ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Planning Poker é a ferramenta certa para este item?</text>
  <text x="700" y="98" text-anchor="middle" fill="#aeb7d4" font-family="Arial, sans-serif" font-size="21">Siga o “sim”; use a saída lateral quando a resposta for “não”.</text>

  <g font-family="Arial, sans-serif">
    <rect x="36" y="170" width="248" height="184" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="74" cy="208" r="21" fill="url(#violet)"/><text x="74" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text>
    <text x="160" y="246" text-anchor="middle" fill="#fff" font-size="24" font-weight="700"><tspan x="160">Mais de uma</tspan><tspan x="160" dy="32">perspectiva pode</tspan><tspan x="160" dy="32">mudar a decisão?</tspan></text>

    <rect x="326" y="170" width="248" height="184" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="364" cy="208" r="21" fill="url(#violet)"/><text x="364" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
    <text x="450" y="246" text-anchor="middle" fill="#fff" font-size="24" font-weight="700"><tspan x="450">Há contexto</tspan><tspan x="450" dy="32">suficiente para</tspan><tspan x="450" dy="32">comparar o item?</tspan></text>

    <rect x="616" y="170" width="248" height="184" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="654" cy="208" r="21" fill="url(#violet)"/><text x="654" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
    <text x="740" y="246" text-anchor="middle" fill="#fff" font-size="24" font-weight="700"><tspan x="740">Quem fará o trabalho</tspan><tspan x="740" dy="32">participa e conhece</tspan><tspan x="740" dy="32">as referências?</tspan></text>

    <rect x="906" y="170" width="248" height="184" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="944" cy="208" r="21" fill="url(#violet)"/><text x="944" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text>
    <text x="1030" y="246" text-anchor="middle" fill="#fff" font-size="24" font-weight="700"><tspan x="1030">Existe segurança</tspan><tspan x="1030" dy="32">para escolher e</tspan><tspan x="1030" dy="32">discordar?</tspan></text>

    <path d="M284 262H314" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/><text x="299" y="245" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM</text>
    <path d="M574 262H604" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/><text x="589" y="245" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM</text>
    <path d="M864 262H894" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/><text x="879" y="245" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM</text>
    <path d="M1154 262H1190" stroke="#55e6f2" stroke-width="4" marker-end="url(#arrow)"/><text x="1172" y="245" text-anchor="middle" fill="#bff8ff" font-size="17" font-weight="700">SIM</text>

    <rect x="1192" y="170" width="172" height="184" rx="24" fill="#10364c" stroke="#55e6f2" stroke-width="3" filter="url(#glow)"/>
    <text x="1278" y="218" text-anchor="middle" fill="#bff8ff" font-size="18" font-weight="700">USE</text>
    <text x="1278" y="260" text-anchor="middle" fill="#fff" font-size="27" font-weight="800"><tspan x="1278">Planning</tspan><tspan x="1278" dy="34">Poker</tspan></text>
    <text x="1278" y="332" text-anchor="middle" fill="#aedbe3" font-size="17">Converse e registre</text>

    <path d="M160 354V428" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/><text x="178" y="397" fill="#909ab8" font-size="17" font-weight="700">NÃO</text>
    <path d="M450 354V428" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/><text x="468" y="397" fill="#909ab8" font-size="17" font-weight="700">NÃO</text>
    <path d="M740 354V428" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/><text x="758" y="397" fill="#909ab8" font-size="17" font-weight="700">NÃO</text>
    <path d="M1030 354V428" stroke="#66708f" stroke-width="3" marker-end="url(#arrowNo)"/><text x="1048" y="397" fill="#909ab8" font-size="17" font-weight="700">NÃO</text>

    <rect x="36" y="442" width="248" height="168" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="160" y="486" text-anchor="middle" fill="#dce2f4" font-size="21" font-weight="700"><tspan x="160">Use estimativa</tspan><tspan x="160" dy="28">simples e revisável</tspan></text>
    <text x="160" y="555" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="160">Registre premissas.</tspan><tspan x="160" dy="24">Evite reunião sem ganho.</tspan></text>

    <rect x="326" y="442" width="248" height="168" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="450" y="486" text-anchor="middle" fill="#dce2f4" font-size="21" font-weight="700"><tspan x="450">Esclareça, divida</tspan><tspan x="450" dy="28">ou investigue</tspan></text>
    <text x="450" y="555" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="450">Não transforme lacuna</tspan><tspan x="450" dy="24">em um número.</tspan></text>

    <rect x="616" y="442" width="248" height="168" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="740" y="486" text-anchor="middle" fill="#dce2f4" font-size="21" font-weight="700"><tspan x="740">Reúna quem entrega</tspan><tspan x="740" dy="28">e calibre a escala</tspan></text>
    <text x="740" y="555" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="740">Compartilhe histórias</tspan><tspan x="740" dy="24">de referência.</tspan></text>

    <rect x="906" y="442" width="248" height="168" rx="22" fill="#111a2d" stroke="#47516e"/>
    <text x="1030" y="486" text-anchor="middle" fill="#dce2f4" font-size="21" font-weight="700"><tspan x="1030">Separe prazo, cargo</tspan><tspan x="1030" dy="28">e tamanho</tspan></text>
    <text x="1030" y="555" text-anchor="middle" fill="#98a4c2" font-size="17"><tspan x="1030">Proteja a conversa</tspan><tspan x="1030" dy="24">antes de votar.</tspan></text>

    <rect x="36" y="662" width="1328" height="76" rx="22" fill="#171b38" stroke="#654ee0"/>
    <text x="700" y="694" text-anchor="middle" fill="#ddd7ff" font-size="21" font-weight="700">Critério de sucesso: a conversa produziu informação ou decisão que não existia antes?</text>
    <text x="700" y="723" text-anchor="middle" fill="#9fa9c8" font-size="18">Se não, simplifique o próximo item em vez de proteger o ritual.</text>
  </g>
</svg>
