<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo para tratar as cartas especiais do Planning Poker</title>
  <desc id="desc">A interrogação leva a nomear a dúvida, esclarecer ou adiar. O café leva a pausar, combinar retorno e retomar a rodada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#111b36"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e6f2"/><stop offset="1" stop-color="#219bd8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e6f2"/></marker>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <path d="M0 130H1400M0 394H1400M0 658H1400" stroke="#fff" stroke-opacity=".035"/>
  <text x="700" y="66" text-anchor="middle" fill="#f7f8ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">A carta foi revelada. O que fazer agora?</text>
  <rect x="74" y="118" width="560" height="584" rx="28" fill="#15152e" stroke="#8f70ff" stroke-width="2"/>
  <rect x="766" y="118" width="560" height="584" rx="28" fill="#0d2034" stroke="#47d9ee" stroke-width="2"/>
  <rect x="110" y="156" width="116" height="150" rx="20" fill="url(#violet)" filter="url(#glow)"/>
  <text x="168" y="261" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="96" font-weight="800">?</text>
  <text x="254" y="205" fill="#f4f0ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Falta informação</text>
  <text x="254" y="248" fill="#bbb5d9" font-family="Arial, sans-serif" font-size="23">Não existe estimativa sustentável ainda.</text>
  <rect x="110" y="356" width="488" height="76" rx="18" fill="#211f43"/>
  <text x="354" y="388" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Nomeie a dúvida</text>
  <text x="354" y="417" text-anchor="middle" fill="#bdb7dc" font-family="Arial, sans-serif" font-size="18">“Falta saber...”</text>
  <path d="M354 434V472" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrowV)"/>
  <rect x="110" y="488" width="220" height="94" rx="18" fill="#211f43"/>
  <text x="220" y="524" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Há resposta agora?</text>
  <text x="220" y="554" text-anchor="middle" fill="#bdb7dc" font-family="Arial, sans-serif" font-size="17">Esclareça e revote</text>
  <rect x="378" y="488" width="220" height="94" rx="18" fill="#211f43"/>
  <text x="488" y="524" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">A resposta depende?</text>
  <text x="488" y="554" text-anchor="middle" fill="#bdb7dc" font-family="Arial, sans-serif" font-size="17">Registre e adie</text>
  <rect x="110" y="618" width="488" height="52" rx="16" fill="#2b245b"/>
  <text x="354" y="651" text-anchor="middle" fill="#ded8ff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Saída: nova votação ou investigação explícita</text>
  <rect x="802" y="156" width="116" height="150" rx="20" fill="url(#cyan)" filter="url(#glow)"/>
  <path d="M828 224h65v33c0 18-15 33-33 33s-32-15-32-33v-33zm65 8h14c18 0 18 28 0 28h-14M842 205c-10-13 10-18 0-31M861 205c-10-13 10-18 0-31M880 205c-10-13 10-18 0-31" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="946" y="205" fill="#e9fbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">É hora de pausar</text>
  <text x="946" y="248" fill="#a9cad7" font-family="Arial, sans-serif" font-size="23">Não avance com parte da equipe.</text>
  <rect x="802" y="356" width="488" height="76" rx="18" fill="#12304a"/>
  <text x="1046" y="388" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Reconheça o pedido</text>
  <text x="1046" y="417" text-anchor="middle" fill="#aed2de" font-family="Arial, sans-serif" font-size="18">Sem exigir justificativa pessoal</text>
  <path d="M1046 434V472" stroke="#55e6f2" stroke-width="4" marker-end="url(#arrowC)"/>
  <rect x="802" y="488" width="220" height="94" rx="18" fill="#12304a"/>
  <text x="912" y="524" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Combine duração</text>
  <text x="912" y="554" text-anchor="middle" fill="#aed2de" font-family="Arial, sans-serif" font-size="17">E horário de retorno</text>
  <rect x="1070" y="488" width="220" height="94" rx="18" fill="#12304a"/>
  <text x="1180" y="524" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Retome o contexto</text>
  <text x="1180" y="554" text-anchor="middle" fill="#aed2de" font-family="Arial, sans-serif" font-size="17">Então reinicie a rodada</text>
  <rect x="802" y="618" width="488" height="52" rx="16" fill="#10435b"/>
  <text x="1046" y="651" text-anchor="middle" fill="#c9f7ff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Saída: grupo completo e atenção recuperada</text>
</svg>
