<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Choosing between synchronous and asynchronous Planning Poker</title>
  <desc id="desc">A vertical flow that starts with the availability of a shared time window and recommends a synchronous session, asynchronous preparation with a short meeting, or a fully asynchronous tool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1d"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#0a142b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#886bff"/>
      <stop offset="1" stop-color="#4de3e3"/>
    </linearGradient>
  </defs>
  <rect width="768" height="1120" rx="32" fill="url(#bg)"/>
  <circle cx="660" cy="80" r="170" fill="#7048f5" opacity="0.13"/>
  <circle cx="90" cy="1040" r="160" fill="#4de3e3" opacity="0.08"/>

  <text x="48" y="74" fill="#f8faff" font-family="Arial, sans-serif" font-size="39" font-weight="700">Which format should you use?</text>
  <text x="48" y="116" fill="#9aa7c4" font-family="Arial, sans-serif" font-size="22">Choose based on the time your team shares.</text>

  <rect x="48" y="164" width="672" height="112" rx="24" fill="#172342" stroke="url(#brand)" stroke-width="3"/>
  <text x="384" y="208" text-anchor="middle" fill="#c2b5ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">KEY QUESTION</text>
  <text x="384" y="251" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Is there a short shared time window?</text>

  <rect x="48" y="322" width="672" height="184" rx="24" fill="#111931" stroke="#4de3e3" stroke-width="2"/>
  <rect x="76" y="348" width="74" height="34" rx="17" fill="#123b4a"/>
  <text x="113" y="372" text-anchor="middle" fill="#69f1f1" font-family="Arial, sans-serif" font-size="17" font-weight="700">YES</text>
  <text x="76" y="426" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Synchronous session</text>
  <text x="76" y="466" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Context → secret vote → reveal</text>
  <text x="76" y="494" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">→ discussion → recorded decision</text>

  <rect x="48" y="544" width="672" height="184" rx="24" fill="#151b39" stroke="#886bff" stroke-width="2"/>
  <rect x="76" y="570" width="178" height="34" rx="17" fill="#322464"/>
  <text x="165" y="594" text-anchor="middle" fill="#c2b5ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">WITH ADJUSTMENT</text>
  <text x="76" y="648" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Prepare beforehand</text>
  <text x="76" y="688" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Share the story and criteria in advance;</text>
  <text x="76" y="716" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">meet briefly to vote and discuss.</text>

  <rect x="48" y="766" width="672" height="184" rx="24" fill="#171d35" stroke="#7583a8" stroke-width="2"/>
  <rect x="76" y="792" width="74" height="34" rx="17" fill="#283149"/>
  <text x="113" y="816" text-anchor="middle" fill="#c8d0e5" font-family="Arial, sans-serif" font-size="17" font-weight="700">NO</text>
  <text x="76" y="870" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Asynchronous flow</text>
  <text x="76" y="910" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Use a tool with deadlines, comments,</text>
  <text x="76" y="938" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">and clear closing rules.</text>

  <rect x="48" y="994" width="672" height="78" rx="18" fill="#0c1329" stroke="#273454"/>
  <text x="384" y="1027" text-anchor="middle" fill="#aab5cf" font-family="Arial, sans-serif" font-size="19">Battle Poker is synchronous: use it when the team</text>
  <text x="384" y="1054" text-anchor="middle" fill="#aab5cf" font-family="Arial, sans-serif" font-size="19">can vote and reveal at the same time.</text>
</svg>
