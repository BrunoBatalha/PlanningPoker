<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Decisão entre Planning Poker síncrono e assíncrono</title>
  <desc id="desc">Fluxo vertical que parte da existência de um horário comum e indica sessão síncrona, preparação assíncrona com encontro curto ou ferramenta totalmente assíncrona.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1d"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#0a142b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#886bff"/>
      <stop offset="1" stop-color="#4de3e3"/>
    </linearGradient>
  </defs>
  <rect width="768" height="1120" rx="32" fill="url(#bg)"/>
  <circle cx="660" cy="80" r="170" fill="#7048f5" opacity="0.13"/>
  <circle cx="90" cy="1040" r="160" fill="#4de3e3" opacity="0.08"/>

  <text x="48" y="74" fill="#f8faff" font-family="Arial, sans-serif" font-size="39" font-weight="700">Qual formato usar?</text>
  <text x="48" y="116" fill="#9aa7c4" font-family="Arial, sans-serif" font-size="22">Escolha pelo tempo que a equipe compartilha.</text>

  <rect x="48" y="164" width="672" height="112" rx="24" fill="#172342" stroke="url(#brand)" stroke-width="3"/>
  <text x="384" y="208" text-anchor="middle" fill="#c2b5ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">PERGUNTA CENTRAL</text>
  <text x="384" y="251" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Há um horário curto em comum?</text>

  <rect x="48" y="322" width="672" height="184" rx="24" fill="#111931" stroke="#4de3e3" stroke-width="2"/>
  <rect x="76" y="348" width="74" height="34" rx="17" fill="#123b4a"/>
  <text x="113" y="372" text-anchor="middle" fill="#69f1f1" font-family="Arial, sans-serif" font-size="17" font-weight="700">SIM</text>
  <text x="76" y="426" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Sessão síncrona</text>
  <text x="76" y="466" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Contexto → voto secreto → revelação</text>
  <text x="76" y="494" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">→ conversa → decisão registrada</text>

  <rect x="48" y="544" width="672" height="184" rx="24" fill="#151b39" stroke="#886bff" stroke-width="2"/>
  <rect x="76" y="570" width="158" height="34" rx="17" fill="#322464"/>
  <text x="155" y="594" text-anchor="middle" fill="#c2b5ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">COM AJUSTE</text>
  <text x="76" y="648" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Prepare antes</text>
  <text x="76" y="688" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Envie história e critérios antes; use um</text>
  <text x="76" y="716" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">encontro curto para votar e discutir.</text>

  <rect x="48" y="766" width="672" height="184" rx="24" fill="#171d35" stroke="#7583a8" stroke-width="2"/>
  <rect x="76" y="792" width="74" height="34" rx="17" fill="#283149"/>
  <text x="113" y="816" text-anchor="middle" fill="#c8d0e5" font-family="Arial, sans-serif" font-size="17" font-weight="700">NÃO</text>
  <text x="76" y="870" fill="#f8faff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Fluxo assíncrono</text>
  <text x="76" y="910" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">Use uma ferramenta com prazo, comentários</text>
  <text x="76" y="938" fill="#aab5cf" font-family="Arial, sans-serif" font-size="21">e regras claras de encerramento.</text>

  <rect x="48" y="994" width="672" height="78" rx="18" fill="#0c1329" stroke="#273454"/>
  <text x="384" y="1027" text-anchor="middle" fill="#aab5cf" font-family="Arial, sans-serif" font-size="19">O Battle Poker é síncrono: use quando a equipe</text>
  <text x="384" y="1054" text-anchor="middle" fill="#aab5cf" font-family="Arial, sans-serif" font-size="19">puder votar e revelar ao mesmo tempo.</text>
</svg>
