<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">How to handle a high Fibonacci card</title>
  <desc id="desc">A vertical decision flow for clarifying uncertainty, splitting a large item, or comparing it with reference stories again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1d"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7655ef"/><stop offset="1" stop-color="#3b2a8f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67dfe3"/></marker>
  </defs>
  <rect width="768" height="1120" rx="28" fill="url(#bg)"/>
  <text x="44" y="55" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2">FACILITATION DECISION</text>
  <text x="44" y="100" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="700">A 13 or higher appeared.</text>
  <text x="44" y="139" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="700">What now?</text>
  <g filter="url(#shadow)"><rect x="44" y="185" width="132" height="176" rx="20" fill="url(#card)" stroke="#aa93ff" stroke-width="3"/><rect x="60" y="201" width="100" height="144" rx="14" fill="none" stroke="#c8bcff" stroke-opacity=".55"/><text x="110" y="303" text-anchor="middle" fill="white" font-family="Manrope,Arial,sans-serif" font-size="65" font-weight="800">13</text></g>
  <path d="M190 273h70" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="280" y="195" width="444" height="156" rx="22" fill="#151f3d" stroke="#7760e7" stroke-width="2"/><text x="502" y="248" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Enough information?</text><text x="502" y="290" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="21">Do scope, criteria, and dependencies</text><text x="502" y="319" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="21">support a comparison?</text></g>
  <path d="M502 351v62" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="520" y="391" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">NO</text>
  <g filter="url(#shadow)"><rect x="165" y="433" width="438" height="145" rx="22" fill="#132d3a" stroke="#49ced4" stroke-width="2"/><text x="384" y="484" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Use ? and clarify</text><text x="384" y="527" text-anchor="middle" fill="#b9dfe2" font-family="Inter,Arial,sans-serif" font-size="22">Record the decisive question.</text><text x="384" y="555" text-anchor="middle" fill="#b9dfe2" font-family="Inter,Arial,sans-serif" font-size="22">Do not hide uncertainty in a number.</text></g>
  <path d="M280 331c-110 50-118 216-45 282" fill="none" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="182" y="412" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">YES</text>
  <g filter="url(#shadow)"><rect x="165" y="630" width="438" height="145" rx="22" fill="#151f3d" stroke="#7760e7" stroke-width="2"/><text x="384" y="681" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Is it a coherent item?</text><text x="384" y="724" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="22">Does it deliver value and fit</text><text x="384" y="752" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="22">the team's planning horizon?</text></g>
  <path d="M300 775l-95 78" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="216" y="815" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">NO</text>
  <path d="M468 775l95 78" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="527" y="815" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">YES</text>
  <g filter="url(#shadow)"><rect x="44" y="875" width="294" height="175" rx="22" fill="#2d214e" stroke="#9e7bff" stroke-width="2"/><text x="191" y="933" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Split it</text><text x="191" y="977" text-anchor="middle" fill="#d7ccff" font-family="Inter,Arial,sans-serif" font-size="22">Preserve value and</text><text x="191" y="1006" text-anchor="middle" fill="#d7ccff" font-family="Inter,Arial,sans-serif" font-size="22">estimate each part.</text></g>
  <g filter="url(#shadow)"><rect x="365" y="875" width="359" height="175" rx="22" fill="#1c2648" stroke="#7760e7" stroke-width="2"/><text x="544" y="929" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="700">Compare and vote again</text><text x="544" y="972" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="21">Review the references and</text><text x="544" y="1000" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="21">record the assumption</text><text x="544" y="1028" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="21">behind the high category.</text></g>
</svg>
