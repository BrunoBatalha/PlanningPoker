<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">How to handle a high Fibonacci card</title>
  <desc id="desc">A decision flow for clarifying uncertainty, splitting a large item, or comparing it with reference stories again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1d"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7655ef"/><stop offset="1" stop-color="#3b2a8f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67dfe3"/></marker>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <g opacity=".18" stroke="#7862e8"><path d="M0 130h1400M0 394h1400M0 658h1400M230 0v788M700 0v788M1170 0v788"/></g>
  <text x="70" y="78" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">FACILITATION DECISION</text>
  <text x="70" y="128" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="42" font-weight="700">A 13 or higher appeared. What now?</text>

  <g filter="url(#shadow)"><rect x="75" y="205" width="170" height="230" rx="24" fill="url(#card)" stroke="#aa93ff" stroke-width="3"/><rect x="95" y="225" width="130" height="190" rx="17" fill="none" stroke="#c8bcff" stroke-opacity=".55"/><text x="160" y="355" text-anchor="middle" fill="white" font-family="Manrope,Arial,sans-serif" font-size="88" font-weight="800">13</text></g>

  <path d="M260 320h165" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="445" y="230" width="330" height="180" rx="24" fill="#151f3d" stroke="#7760e7" stroke-width="2"/><text x="610" y="294" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="700">Enough information?</text><text x="610" y="340" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="19">Do scope, criteria, and dependencies</text><text x="610" y="370" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="19">support a comparison?</text></g>

  <path d="M775 275h145" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="840" y="257" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">NO</text>
  <g filter="url(#shadow)"><rect x="940" y="200" width="385" height="155" rx="24" fill="#132d3a" stroke="#49ced4" stroke-width="2"/><text x="1132" y="258" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Use ? and clarify</text><text x="1132" y="302" text-anchor="middle" fill="#b9dfe2" font-family="Inter,Arial,sans-serif" font-size="20">Record the decisive question.</text><text x="1132" y="330" text-anchor="middle" fill="#b9dfe2" font-family="Inter,Arial,sans-serif" font-size="20">Do not hide uncertainty in a number.</text></g>

  <path d="M610 410v115" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="630" y="475" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">YES</text>
  <g filter="url(#shadow)"><rect x="445" y="545" width="330" height="150" rx="24" fill="#151f3d" stroke="#7760e7" stroke-width="2"/><text x="610" y="603" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Is it a coherent item?</text><text x="610" y="648" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="20">Does it deliver value and fit</text><text x="610" y="676" text-anchor="middle" fill="#aeb8cf" font-family="Inter,Arial,sans-serif" font-size="20">the team's planning horizon?</text></g>

  <path d="M445 620H305" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="350" y="600" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">NO</text>
  <g filter="url(#shadow)"><rect x="70" y="535" width="215" height="170" rx="24" fill="#2d214e" stroke="#9e7bff" stroke-width="2"/><text x="177" y="595" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Split it</text><text x="177" y="638" text-anchor="middle" fill="#d7ccff" font-family="Inter,Arial,sans-serif" font-size="19">Preserve value and</text><text x="177" y="666" text-anchor="middle" fill="#d7ccff" font-family="Inter,Arial,sans-serif" font-size="19">estimate each part.</text></g>

  <path d="M775 620h145" stroke="#67dfe3" stroke-width="5" marker-end="url(#arrow)"/><text x="840" y="600" fill="#67dfe3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">YES</text>
  <g filter="url(#shadow)"><rect x="940" y="535" width="385" height="170" rx="24" fill="#1c2648" stroke="#7760e7" stroke-width="2"/><text x="1132" y="592" text-anchor="middle" fill="#f8faff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Compare and vote again</text><text x="1132" y="636" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="19">Review the reference stories.</text><text x="1132" y="664" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="19">Record the assumption behind</text><text x="1132" y="692" text-anchor="middle" fill="#c8d0e5" font-family="Inter,Arial,sans-serif" font-size="19">the high category.</text></g>
</svg>
