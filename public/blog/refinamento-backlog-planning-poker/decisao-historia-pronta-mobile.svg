<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Decisão para estimar uma história no refinamento</title>
  <desc id="desc">Fluxo vertical com seis perguntas que encaminha a história para estimar, esclarecer, dividir ou investigar.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090A16"/><stop offset="1" stop-color="#15102C"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs>
  <rect width="768" height="1120" rx="32" fill="url(#bg)"/>
  <text x="42" y="64" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">História pronta para estimar?</text><text x="42" y="95" fill="#AEB7CF" font-family="Segoe UI,Arial,sans-serif" font-size="16">Seis perguntas, quatro saídas honestas</text>
  <rect x="36" y="125" width="696" height="570" rx="24" fill="#111226" stroke="#8B5CF6" stroke-opacity=".6"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(64 165)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">1</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Resultado e usuário claros?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">Todos explicam o mesmo benefício.</text></g>
    <g transform="translate(64 250)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">2</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Limites explícitos?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">Entradas, exclusões, permissões, volume.</text></g>
    <g transform="translate(64 335)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">3</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Critérios verificáveis?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">Sucesso, limite e falha observáveis.</text></g>
    <g transform="translate(64 420)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">4</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Dependências e riscos visíveis?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">O que altera o tamanho apareceu.</text></g>
    <g transform="translate(64 505)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">5</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Conhecimento permite comparar?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">Incerteza restante é normal.</text></g>
    <g transform="translate(64 590)"><circle cx="18" cy="18" r="18" fill="#34235F"/><text x="18" y="25" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">6</text><text x="54" y="12" fill="#F8FAFC" font-size="21" font-weight="600">Cabe em uma Sprint?</text><text x="54" y="40" fill="#9BA6C1" font-size="15">Existe caminho realista para Done.</text></g>
    <path d="M384 695V733" stroke="#7DD3FC" stroke-width="4"/><path d="M374 722L384 734 394 722" fill="none" stroke="#7DD3FC" stroke-width="4"/>
    <rect x="36" y="745" width="696" height="112" rx="22" fill="url(#cyan)"/><text x="68" y="786" fill="#06111E" font-size="15" font-weight="700" letter-spacing="1.5">CLAREZA SUFICIENTE</text><text x="68" y="827" fill="#FFFFFF" font-size="28" font-weight="700">ESTIMAR  ·  3  5  8</text>
    <rect x="36" y="877" width="215" height="135" rx="20" fill="#231A42" stroke="#8B5CF6"/><text x="58" y="917" fill="#C4B5FD" font-size="14" font-weight="700">REGRA INDEFINIDA</text><text x="58" y="957" fill="#FFFFFF" font-size="23" font-weight="700">ESCLARECER</text><text x="58" y="986" fill="#AEB7CF" font-size="14">Pergunta + responsável</text>
    <rect x="276" y="877" width="215" height="135" rx="20" fill="#231A42" stroke="#8B5CF6"/><text x="300" y="917" fill="#C4B5FD" font-size="14" font-weight="700">ITEM GRANDE</text><text x="300" y="957" fill="#FFFFFF" font-size="23" font-weight="700">DIVIDIR</text><text x="300" y="986" fill="#AEB7CF" font-size="14">Fatias com valor</text>
    <rect x="516" y="877" width="216" height="135" rx="20" fill="url(#violet)"/><text x="538" y="917" fill="#DDD6FE" font-size="14" font-weight="700">DÚVIDA DOMINANTE</text><text x="538" y="957" fill="#FFFFFF" font-size="23" font-weight="700">INVESTIGAR</text><text x="538" y="986" fill="#E9E4FF" font-size="14">Experimento curto</text>
  </g>
  <text x="42" y="1070" fill="#7DD3FC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">BATTLE POKER</text><text x="726" y="1070" text-anchor="end" fill="#8792AE" font-family="Segoe UI,Arial,sans-serif" font-size="14">Guia de conversa, não barreira.</text>
</svg>
