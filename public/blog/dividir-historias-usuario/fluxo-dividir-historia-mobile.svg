<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Da carta alta à nova estimativa no celular</title>
  <desc id="desc">Sequência móvel com leitura do sinal, diagnóstico, fatia vertical, teste da fatia e uma nova rodada de Planning Poker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#101a34"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e6f2"/></marker>
  </defs>
  <rect width="768" height="1120" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="384" y="48" text-anchor="middle" fill="#f7f8ff" font-size="30" font-weight="800">Da carta alta à nova estimativa</text>
    <text x="384" y="82" text-anchor="middle" fill="#aeb7d4" font-size="18">Mude o recorte antes do número.</text>

    <rect x="36" y="108" width="696" height="170" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="82" cy="151" r="22" fill="url(#violet)"/><text x="82" y="159" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">1</text>
    <text x="120" y="157" fill="#c9bdff" font-size="18" font-weight="700">LEIA O SINAL</text>
    <rect x="572" y="127" width="64" height="88" rx="11" fill="#26214a" stroke="#a78bfa"/><text x="604" y="183" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">21</text>
    <rect x="642" y="127" width="64" height="88" rx="11" fill="#26214a" stroke="#a78bfa"/><text x="674" y="183" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">?</text>
    <text x="82" y="208" fill="#fff" font-size="22" font-weight="700">Carta alta, dúvida ou votos distantes</text>
    <text x="82" y="244" fill="#9da8c8" font-size="17">Encerre sem forçar uma média.</text>
    <path d="M384 278V309" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="36" y="320" width="696" height="176" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="82" cy="363" r="22" fill="url(#violet)"/><text x="82" y="371" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
    <text x="120" y="369" fill="#c9bdff" font-size="18" font-weight="700">DIAGNOSTIQUE O TAMANHO</text>
    <text x="82" y="414" fill="#e9ecff" font-size="19">Muitos resultados → dividir</text>
    <text x="82" y="446" fill="#c7d2fe" font-size="19">Desconhecido dominante → investigar com limite</text>
    <text x="82" y="478" fill="#bff8ff" font-size="19">Escopos diferentes → alinhar premissas</text>
    <path d="M384 496V527" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="36" y="538" width="696" height="188" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="82" cy="581" r="22" fill="url(#violet)"/><text x="82" y="589" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">3</text>
    <text x="120" y="587" fill="#c9bdff" font-size="18" font-weight="700">FATIE VERTICALMENTE</text>
    <text x="82" y="632" fill="#fff" font-size="21" font-weight="700">Nomeie o menor resultado útil</text>
    <rect x="82" y="651" width="590" height="22" rx="7" fill="#6d4df5"/><text x="377" y="667" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">INTERFACE</text>
    <rect x="82" y="678" width="590" height="22" rx="7" fill="#4267cc"/><text x="377" y="694" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">REGRA / INTEGRAÇÃO</text>
    <rect x="82" y="705" width="590" height="22" rx="7" fill="#1685a4"/><text x="377" y="721" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">DADOS + TESTE</text>
    <path d="M384 726V757" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="36" y="768" width="696" height="188" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="82" cy="811" r="22" fill="url(#violet)"/><text x="82" y="819" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">4</text>
    <text x="120" y="817" fill="#c9bdff" font-size="18" font-weight="700">TESTE A FATIA</text>
    <text x="82" y="860" fill="#bff8ff" font-size="18">✓ Resultado perceptível</text>
    <text x="375" y="860" fill="#bff8ff" font-size="18">✓ Fluxo ponta a ponta</text>
    <text x="82" y="899" fill="#bff8ff" font-size="18">✓ Critérios observáveis</text>
    <text x="375" y="899" fill="#bff8ff" font-size="18">✓ Pode chegar a Done</text>
    <text x="82" y="937" fill="#d6aab9" font-size="17">Se não passar, refaça o corte — não crie camadas isoladas.</text>
    <path d="M384 956V987" stroke="#55e6f2" stroke-width="4" marker-end="url(#arrowCyan)"/>

    <rect x="70" y="998" width="628" height="91" rx="23" fill="#10364c" stroke="#55e6f2" stroke-width="3"/>
    <text x="384" y="1034" text-anchor="middle" fill="#bff8ff" font-size="19" font-weight="700">NOVA RODADA NO PLANNING POKER</text>
    <text x="384" y="1067" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Nomeie → vote oculto → revele → decida</text>
  </g>
</svg>
