<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Decisão para mitigar, investigar ou estimar um bug</title>
  <desc id="desc">O fluxo começa pelo impacto ativo, verifica reprodução e limites, depois critérios de conclusão. As saídas são mitigar, investigar, esclarecer ou usar Planning Poker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#111b36"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowAlt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66708f"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <path d="M0 150H1400M0 420H1400M0 680H1400" stroke="#fff" stroke-opacity=".035"/>
  <g font-family="Arial, sans-serif">
    <text x="700" y="60" text-anchor="middle" fill="#f7f8ff" font-size="34" font-weight="700">Este bug está pronto para receber story points?</text>
    <text x="700" y="99" text-anchor="middle" fill="#aeb7d4" font-size="21">Decida a resposta operacional antes de abrir a votação.</text>

    <rect x="70" y="180" width="300" height="190" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="116" cy="226" r="23" fill="url(#violet)"/><text x="116" y="234" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text>
    <text x="220" y="257" text-anchor="middle" fill="#fff" font-size="25" font-weight="700"><tspan x="220">Existe impacto ativo</tspan><tspan x="220" dy="34">que exige resposta?</tspan></text>
    <text x="220" y="336" text-anchor="middle" fill="#aeb7d4" font-size="18">Usuários, dados ou operação</text>

    <rect x="550" y="180" width="300" height="190" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="596" cy="226" r="23" fill="url(#violet)"/><text x="596" y="234" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
    <text x="700" y="245" text-anchor="middle" fill="#fff" font-size="25" font-weight="700"><tspan x="700">Consegue reproduzir</tspan><tspan x="700" dy="34">ou delimitar?</tspan></text>
    <text x="700" y="324" text-anchor="middle" fill="#aeb7d4" font-size="18"><tspan x="700">Sintoma, ambiente, evidência</tspan><tspan x="700" dy="25">e fronteira observável</tspan></text>

    <rect x="1030" y="180" width="300" height="190" rx="24" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="1076" cy="226" r="23" fill="url(#violet)"/><text x="1076" y="234" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
    <text x="1180" y="245" text-anchor="middle" fill="#fff" font-size="25" font-weight="700"><tspan x="1180">Conclusão e regressão</tspan><tspan x="1180" dy="34">estão claras?</tspan></text>
    <text x="1180" y="324" text-anchor="middle" fill="#aeb7d4" font-size="18"><tspan x="1180">Correção, testes, dados</tspan><tspan x="1180" dy="25">e entrega incluídos</tspan></text>

    <path d="M370 275H538" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/><text x="454" y="256" text-anchor="middle" fill="#c9bdff" font-size="18" font-weight="700">NÃO</text>
    <path d="M850 275H1018" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/><text x="934" y="256" text-anchor="middle" fill="#c9bdff" font-size="18" font-weight="700">SIM</text>
    <path d="M220 370V438" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/><text x="244" y="415" fill="#98a4c2" font-size="18" font-weight="700">SIM</text>
    <path d="M700 370V438" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/><text x="724" y="415" fill="#98a4c2" font-size="18" font-weight="700">NÃO</text>
    <path d="M1180 370V438" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/><text x="1204" y="415" fill="#98a4c2" font-size="18" font-weight="700">NÃO</text>

    <rect x="70" y="452" width="300" height="168" rx="23" fill="#2c1727" stroke="#f87171" stroke-width="2"/>
    <text x="220" y="500" text-anchor="middle" fill="#fecaca" font-size="20" font-weight="700">MITIGUE PRIMEIRO</text>
    <text x="220" y="541" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Reduza o impacto</text>
    <text x="220" y="580" text-anchor="middle" fill="#d6aab9" font-size="18"><tspan x="220">Estime depois o trabalho</tspan><tspan x="220" dy="24">permanente e delimitado.</tspan></text>

    <rect x="550" y="452" width="300" height="168" rx="23" fill="#171b38" stroke="#6470a6" stroke-width="2"/>
    <text x="700" y="500" text-anchor="middle" fill="#c7d2fe" font-size="20" font-weight="700">INVESTIGUE</text>
    <text x="700" y="541" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Timebox + saída clara</text>
    <text x="700" y="580" text-anchor="middle" fill="#aeb7d4" font-size="18"><tspan x="700">Reproduza, delimite ou</tspan><tspan x="700" dy="24">descarte hipóteses.</tspan></text>

    <rect x="1030" y="452" width="300" height="168" rx="23" fill="#171b38" stroke="#6470a6" stroke-width="2"/>
    <text x="1180" y="500" text-anchor="middle" fill="#c7d2fe" font-size="20" font-weight="700">ESCLAREÇA</text>
    <text x="1180" y="541" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Complete o item</text>
    <text x="1180" y="580" text-anchor="middle" fill="#aeb7d4" font-size="18"><tspan x="1180">Defina validação, limites</tspan><tspan x="1180" dy="24">e trabalho até Done.</tspan></text>

    <path d="M1180 180V145H1360V650H930" fill="none" stroke="#55e6f2" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1260" y="139" text-anchor="middle" fill="#bff8ff" font-size="18" font-weight="700">SIM</text>
    <rect x="470" y="654" width="460" height="92" rx="24" fill="#10364c" stroke="#55e6f2" stroke-width="3" filter="url(#glow)"/>
    <text x="700" y="691" text-anchor="middle" fill="#bff8ff" font-size="20" font-weight="700">USE PLANNING POKER</text>
    <text x="700" y="725" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">Compare o conserto completo e registre a decisão</text>
  </g>
</svg>
