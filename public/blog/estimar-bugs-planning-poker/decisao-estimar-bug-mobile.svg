<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo móvel para decidir se um bug pode ser estimado</title>
  <desc id="desc">Impacto ativo leva à mitigação. Falta de reprodução leva à investigação. Falta de critérios leva ao esclarecimento. Com as três condições atendidas, use Planning Poker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset="1" stop-color="#111b36"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d4df5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b7bff"/></marker>
    <marker id="arrowAlt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66708f"/></marker>
  </defs>
  <rect width="768" height="1120" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="384" y="47" text-anchor="middle" fill="#f7f8ff" font-size="28" font-weight="700">Este bug está pronto para estimar?</text>
    <text x="384" y="79" text-anchor="middle" fill="#aeb7d4" font-size="18">Decida antes de abrir a votação.</text>

    <rect x="32" y="108" width="350" height="190" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="72" cy="148" r="21" fill="url(#violet)"/><text x="72" y="155" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">1</text>
    <text x="207" y="185" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="207">Existe impacto ativo</tspan><tspan x="207" dy="31">que exige resposta?</tspan></text>
    <text x="207" y="266" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">NÃO ↓</text>
    <path d="M382 203H410" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/>
    <rect x="420" y="108" width="316" height="190" rx="22" fill="#2c1727" stroke="#f87171"/>
    <text x="578" y="160" text-anchor="middle" fill="#fecaca" font-size="19" font-weight="700">SIM: MITIGUE</text>
    <text x="578" y="201" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Reduza o impacto</text>
    <text x="578" y="247" text-anchor="middle" fill="#d6aab9" font-size="17"><tspan x="578">Estime depois o trabalho</tspan><tspan x="578" dy="23">permanente e delimitado.</tspan></text>

    <path d="M207 298V336" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="32" y="346" width="350" height="190" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="72" cy="386" r="21" fill="url(#violet)"/><text x="72" y="393" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
    <text x="207" y="423" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="207">Consegue reproduzir</tspan><tspan x="207" dy="31">ou delimitar?</tspan></text>
    <text x="207" y="504" text-anchor="middle" fill="#c9bdff" font-size="17" font-weight="700">SIM ↓</text>
    <path d="M382 441H410" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/>
    <rect x="420" y="346" width="316" height="190" rx="22" fill="#171b38" stroke="#6470a6"/>
    <text x="578" y="398" text-anchor="middle" fill="#c7d2fe" font-size="19" font-weight="700">NÃO: INVESTIGUE</text>
    <text x="578" y="439" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Timebox + saída</text>
    <text x="578" y="485" text-anchor="middle" fill="#aeb7d4" font-size="17"><tspan x="578">Reproduza, delimite ou</tspan><tspan x="578" dy="23">descarte hipóteses.</tspan></text>

    <path d="M207 536V574" stroke="#9b7bff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="32" y="584" width="350" height="190" rx="22" fill="#171630" stroke="#8f70ff" stroke-width="2"/>
    <circle cx="72" cy="624" r="21" fill="url(#violet)"/><text x="72" y="631" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">3</text>
    <text x="207" y="661" text-anchor="middle" fill="#fff" font-size="23" font-weight="700"><tspan x="207">Conclusão e regressão</tspan><tspan x="207" dy="31">estão claras?</tspan></text>
    <text x="207" y="742" text-anchor="middle" fill="#bff8ff" font-size="17" font-weight="700">SIM ↓</text>
    <path d="M382 679H410" stroke="#66708f" stroke-width="3" marker-end="url(#arrowAlt)"/>
    <rect x="420" y="584" width="316" height="190" rx="22" fill="#171b38" stroke="#6470a6"/>
    <text x="578" y="636" text-anchor="middle" fill="#c7d2fe" font-size="19" font-weight="700">NÃO: ESCLAREÇA</text>
    <text x="578" y="677" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Complete o item</text>
    <text x="578" y="723" text-anchor="middle" fill="#aeb7d4" font-size="17"><tspan x="578">Defina validação, limites</tspan><tspan x="578" dy="23">e trabalho até Done.</tspan></text>

    <path d="M207 774V838" stroke="#55e6f2" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="82" y="850" width="604" height="154" rx="24" fill="#10364c" stroke="#55e6f2" stroke-width="3"/>
    <text x="384" y="902" text-anchor="middle" fill="#bff8ff" font-size="21" font-weight="700">USE PLANNING POKER</text>
    <text x="384" y="946" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Compare o conserto completo</text>
    <text x="384" y="981" text-anchor="middle" fill="#aedbe3" font-size="18">Revele, converse e registre a decisão.</text>

    <rect x="82" y="1030" width="604" height="58" rx="18" fill="#171b38" stroke="#654ee0"/>
    <text x="384" y="1066" text-anchor="middle" fill="#ddd7ff" font-size="18" font-weight="700">Gravidade prioriza; story points comparam trabalho.</text>
  </g>
</svg>
